<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found</title>
    <meta name="robots" content="noindex, follow" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #0a0a0a;
        color: #e5e5e5;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: 6rem;
        font-weight: 700;
        color: #fff;
        line-height: 1;
      }
      h2 {
        font-size: 1.5rem;
        font-weight: 400;
        margin-top: 1rem;
        color: #888;
      }
      p {
        margin-top: 2rem;
        color: #666;
      }
      a {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.75rem 1.5rem;
        background: #fff;
        color: #0a0a0a;
        text-decoration: none;
        border-radius: 4px;
        font-weight: 500;
        transition: opacity 0.2s;
      }
      a:hover { opacity: 0.8; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you're looking for doesn't exist.</p>
      <a href="/">Back to Home</a>
    </div>
  </body>
</html>
